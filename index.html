<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Destekli Çoklu Oynatıcı</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        .media-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        .playlist {
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .playlist-item {
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist-item:hover {
            background: #3a3a3a;
        }
        .playlist-item.active {
            background: #0d6efd;
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: #0d6efd;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #0b5ed7;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .time-display {
            font-size: 14px;
            color: #ccc;
            margin: 5px 0;
        }
        .progress-container {
            width: 100%;
            margin: 10px 0;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .proxy-note {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="media-wrapper" id="mediaWrapper"></div>
        <div class="progress-container">
            <input type="range" id="progressBar" value="0" step="0.1">
        </div>
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        <div class="playlist" id="playlistContainer"></div>
        <div class="controls">
            <button id="prevBtn">⏮ Önceki</button>
            <button id="playPauseBtn">▶ Oynat</button>
            <button id="nextBtn">Sonraki ⏭</button>
        </div>
        <div class="proxy-note">
            🔒 Tüm bağlantılar <strong>corsproxy.io</strong> üzerinden güvenli şekilde aktarılıyor.
        </div>
    </div>

    <script>
        // ===== KENDİ LİNKLERİNİZ =====
        const playlist = [
            { name: "beIN Sports 1-Gav", url: "https://gavatlar.b-cdn.net/bein.m3u8" },
            { name: "FAST FUN BOX TR",  url: "http://cdn.bittv.ltd/ottplayer/bigteisti3/FAST_FUN_BOX_TR/czJyNHd4MGtpczp5eTN3OTk2bDh5/index.m3u8" },
            { name: "linetv (vipru)",     url: "http://vipru.linetv.net:8004/stream/YWxhZHlufHxSMkZpY25sek1qQXhNQT09/7008/index.m3u8" },
            { name: "65.108.239.207",    url: "https://65.108.239.207/t1/index.m3u8" },
            { name: "avva magnitude",    url: "https://avva.magnitude.workers.dev/?url=https://avvaupdate.com/95f0000dd0e/index.m3u8?o=1%26e=1780666353%26tk=737445f71fe0638e5360b8a28286bf03" },
            { name: "zeus324232 (txt)",  url: "https://zeus324232.cfd/b2/index.txt" },
            { name: "chat.cfbu247",      url: "https://chat.cfbu247.sbs/api/proxy/playlist?token=eyJjaGFubmVsSWQiOiI2MiIsInRzIjoxNzc5OTY4MDg5NjQ1fQ==" }
        ];
        // ==============================

        // CORS Proxy kullan (tüm linkler için otomatik)
        const PROXY_URL = "https://corsproxy.io/?";

        let currentIndex = 0;
        let videoElement = null;
        let hls = null;

        const mediaWrapper = document.getElementById('mediaWrapper');
        const playlistContainer = document.getElementById('playlistContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');

        function formatTime(t) {
            if (isNaN(t)) return "00:00";
            const m = Math.floor(t / 60);
            const s = Math.floor(t % 60);
            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        function updateTimeDisplay() {
            if (!videoElement) return;
            timeDisplay.textContent = `${formatTime(videoElement.currentTime)} / ${formatTime(videoElement.duration || 0)}`;
        }

        function destroyHls() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
        }

        function loadMedia(index) {
            destroyHls();
            if (videoElement) {
                videoElement.pause();
                videoElement.removeAttribute('src');
                videoElement.load();
            }

            videoElement = document.createElement('video');
            videoElement.setAttribute('controls', '');
            videoElement.setAttribute('playsinline', '');
            videoElement.setAttribute('crossorigin', 'anonymous');
            mediaWrapper.innerHTML = '';
            mediaWrapper.appendChild(videoElement);

            const originalUrl = playlist[index].url;
            // Tüm linkleri proxy üzerinden geçir
            const proxiedUrl = PROXY_URL + encodeURIComponent(originalUrl);

            const isHls = /\.m3u8($|\?)|\.txt($|\?)/i.test(originalUrl) || 
                         originalUrl.includes('index.m3u8') || 
                         originalUrl.includes('playlist?');

            if (isHls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(proxiedUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(e => console.log('Oynatma başlatılamadı:', e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.warn('HLS hatası:', data.type, data.details);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                destroyHls();
                                break;
                        }
                    }
                });
            } else {
                videoElement.src = proxiedUrl;
                videoElement.play().catch(e => console.log('Oynatma başlatılamadı:', e));
            }

            videoElement.addEventListener('loadedmetadata', () => {
                progressBar.max = videoElement.duration || 0;
                updateTimeDisplay();
            });
            videoElement.addEventListener('timeupdate', () => {
                progressBar.value = videoElement.currentTime;
                updateTimeDisplay();
            });
            videoElement.addEventListener('ended', () => {
                if (currentIndex < playlist.length - 1) {
                    currentIndex++;
                    loadMedia(currentIndex);
                } else {
                    playPauseBtn.textContent = '▶ Oynat';
                }
            });
            videoElement.addEventListener('play', () => {
                playPauseBtn.textContent = '⏸ Duraklat';
            });
            videoElement.addEventListener('pause', () => {
                playPauseBtn.textContent = '▶ Oynat';
            });

            renderPlaylist();
            playPauseBtn.disabled = false;
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                div.innerHTML = `<span>${index + 1}. ${item.name}</span>`;
                div.addEventListener('click', () => {
                    currentIndex = index;
                    loadMedia(currentIndex);
                });
                playlistContainer.appendChild(div);
            });
        }

        playPauseBtn.addEventListener('click', () => {
            if (!videoElement) return;
            if (videoElement.paused) {
                videoElement.play();
            } else {
                videoElement.pause();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadMedia(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < playlist.length - 1) {
                currentIndex++;
                loadMedia(currentIndex);
            }
        });

        progressBar.addEventListener('input', () => {
            if (!videoElement) return;
            videoElement.currentTime = progressBar.value;
        });

        if (playlist.length > 0) {
            loadMedia(0);
        } else {
            playlistContainer.innerHTML = '<p>Hiç link eklenmedi.</p>';
            playPauseBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
        }
    </script>
</body>
</html>
