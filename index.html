<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Otomatik Güncellenen Yayın</title>
    <!-- HLS.js desteği (m3u8 yayınları için) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #1e1e2f;
            color: white;
        }
        video {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
        button {
            background: #3a86ff;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #2666cc;
        }
    </style>
</head>
<body>
    <h1>📺 TABİİ SPOR Canlı Yayın</h1>
    <video id="video-player" controls width="900"></video>
    <div class="status" id="status">Yayın yükleniyor...</div>
    <button onclick="loadChannel()">🔄 Yenile ve Güncel Yayını Al</button>

    <script>
        const video = document.getElementById('video-player');
        const statusDiv = document.getElementById('status');
        
        // M3U listesindeki kanal adıyla BİREBİR AYNI olmalı
        const channelName = 'beIN Sports 2-R';

        let hls = null; // HLS instance'ını sakla

        async function loadChannel() {
            statusDiv.textContent = '📡 Güncel yayın adresi alınıyor...';
            statusDiv.style.color = '#ffaa00';
            
            try {
                // Proxy'den en güncel yayın URL'sini al
                const response = await fetch(`proxy.php?kanal=${encodeURIComponent(channelName)}`);
                const data = await response.json();

                if (data.hata) {
                    statusDiv.textContent = '❌ Hata: ' + data.hata;
                    statusDiv.style.color = '#ff6666';
                    console.error('Proxy hatası:', data.hata);
                    return;
                }

                if (!data.url) {
                    statusDiv.textContent = '❌ Yayın URL'si alınamadı.';
                    statusDiv.style.color = '#ff6666';
                    return;
                }

                const streamUrl = data.url;
                console.log('Alınan yayın adresi:', streamUrl);
                statusDiv.textContent = '✅ Yayın adresi alındı, oynatıcı başlatılıyor...';
                statusDiv.style.color = '#aaffaa';

                // Önceki HLS örneğini temizle
                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                // Video elementini durdur ve sıfırla
                video.pause();
                video.removeAttribute('src');
                video.load();

                // Yayın formatına göre oynatıcıyı seç
                if (streamUrl.includes('.m3u8') && Hls.isSupported()) {
                    // HLS (m3u8) desteği
                    hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log('Otomatik oynatma engellendi:', e));
                        statusDiv.textContent = '📺 Yayın oynatılıyor (HLS)';
                        statusDiv.style.color = '#aaffaa';
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS hatası:', data);
                        statusDiv.textContent = '⚠️ Yayın hatası, yeniden deneyin.';
                        statusDiv.style.color = '#ffaa66';
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari için native HLS desteği
                    video.src = streamUrl;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(e => console.log(e));
                        statusDiv.textContent = '📺 Yayın oynatılıyor (Native HLS)';
                    });
                } else {
                    // Diğer formatlar (mp4 vb.)
                    video.src = streamUrl;
                    video.addEventListener('canplay', () => {
                        video.play().catch(e => console.log(e));
                        statusDiv.textContent = '📺 Yayın oynatılıyor';
                    });
                }
            } catch (error) {
                console.error('Fetch hatası:', error);
                statusDiv.textContent = '❌ Bağlantı hatası: ' + error.message;
                statusDiv.style.color = '#ff6666';
            }
        }

        // Sayfa yüklendiğinde otomatik başlat
        window.addEventListener('load', loadChannel);
    </script>
</body>
</html>
