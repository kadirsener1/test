<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV M3U Player</title>

    <!-- HLS.js kütüphanesi (m3u8 stream oynatmak için) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e94560;
        }

        .header h1 {
            font-size: 24px;
            color: #e94560;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: #888;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Ayarlar Paneli --- */
        .settings-panel {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }

        .settings-panel label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
        }

        .settings-panel input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: #0f0f23;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .settings-panel input[type="text"]:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ff6b81, #e94560);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
        }

        .btn-secondary:hover {
            background: #3a3a5a;
        }

        /* --- Player Bölümü --- */
        .player-section {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .player-info {
            padding: 15px 20px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #333;
        }

        .player-info img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .player-info .channel-name {
            font-size: 16px;
            font-weight: 700;
            color: #e94560;
        }

        .player-info .channel-group {
            font-size: 11px;
            color: #888;
        }

        .live-badge {
            background: #e94560;
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-left: auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            max-height: 600px;
            display: block;
            background: #000;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #aaa;
        }

        /* --- Kanal Listesi --- */
        .channel-list-section {
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #333;
            max-height: 500px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .channel-list-header {
            padding: 15px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channel-list-header h3 {
            font-size: 16px;
            color: #e94560;
        }

        .channel-count {
            font-size: 12px;
            color: #888;
            background: #0f0f23;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid #333;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #0f0f23;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #e94560;
        }

        .channel-list {
            overflow-y: auto;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #1f1f3a;
        }

        .channel-item:hover {
            background: #2a2a4a;
        }

        .channel-item.active {
            background: linear-gradient(135deg, rgba(233,69,96,0.2), rgba(233,69,96,0.05));
            border-left: 3px solid #e94560;
        }

        .channel-item img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
        }

        .channel-item .ch-info {
            flex: 1;
        }

        .channel-item .ch-name {
            font-size: 13px;
            font-weight: 600;
        }

        .channel-item .ch-group {
            font-size: 11px;
            color: #666;
        }

        /* --- Log / Durum --- */
        .status-bar {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px 20px;
            border: 1px solid #333;
        }

        .status-bar .status-text {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }

        .status-bar .status-text.success {
            color: #4ecdc4;
        }

        .status-bar .status-text.error {
            color: #e94560;
        }

        /* --- Responsive --- */
        @media (min-width: 768px) {
            .main-content {
                display: flex;
                gap: 20px;
            }
            .player-side {
                flex: 2;
            }
            .list-side {
                flex: 1;
            }
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .main-content {
                flex-direction: row;
            }
            .player-side {
                flex: 2;
            }
            .list-side {
                flex: 1;
                max-height: 650px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📺 IPTV M3U Player</h1>
        <p>M3U listesinden otomatik kanal çekme ve oynatma</p>
    </div>

    <div class="container">

        <!-- Ayarlar -->
        <div class="settings-panel">
            <label>📋 M3U Liste URL'si:</label>
            <input type="text" id="m3uUrl"
                value="https://raw.githubusercontent.com/kadirsener1/avva/refs/heads/main/playlist.m3u"
                placeholder="M3U dosyasının URL'sini girin...">

            <label>🔍 Kanal Adı Filtresi (isteğe bağlı - belirli bir kanalı bulmak için):</label>
            <input type="text" id="channelFilter"
                value="beIN Sports 2"
                placeholder="Örn: beIN Sports 2">

            <div class="btn-row">
                <button class="btn btn-primary" onclick="loadM3U()">📥 Listeyi Yükle & Kanal Bul</button>
                <button class="btn btn-secondary" onclick="loadM3U(true)">🔄 Yenile (Güncelle)</button>
                <button class="btn btn-secondary" onclick="startAutoRefresh()">⏱️ Otomatik Yenile (5dk)</button>
                <button class="btn btn-secondary" onclick="stopAutoRefresh()">⏹️ Durdur</button>
            </div>
        </div>

        <!-- Ana İçerik -->
        <div class="main-content">

            <!-- Player Tarafı -->
            <div class="player-side">
                <div class="player-section">
                    <div class="player-info" id="playerInfo">
                        <img src="https://via.placeholder.com/40x40/333/888?text=TV" id="channelLogo" alt="logo">
                        <div>
                            <div class="channel-name" id="channelNameDisplay">Kanal seçilmedi</div>
                            <div class="channel-group" id="channelGroupDisplay">Listeyi yükleyin ve kanal seçin</div>
                        </div>
                        <span class="live-badge" id="liveBadge" style="display:none;">● CANLI</span>
                    </div>
                    <div class="video-container">
                        <video id="videoPlayer" controls autoplay playsinline></video>
                        <div class="loading-overlay hidden" id="loadingOverlay">
                            <div class="spinner"></div>
                            <div class="loading-text" id="loadingText">Yükleniyor...</div>
                        </div>
                    </div>
                </div>

                <!-- Durum -->
                <div class="status-bar">
                    <div class="status-text" id="statusText">⏳ Hazır. M3U listesini yüklemek için butona tıklayın.</div>
                </div>
            </div>

            <!-- Kanal Listesi -->
            <div class="list-side">
                <div class="channel-list-section">
                    <div class="channel-list-header">
                        <h3>📺 Kanallar</h3>
                        <span class="channel-count" id="channelCount">0 kanal</span>
                    </div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 Kanal ara..."
                            oninput="filterChannelList()">
                    </div>
                    <div class="channel-list" id="channelList">
                        <div style="padding: 40px; text-align: center; color: #555;">
                            Henüz kanal yüklenmedi
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GLOBAL DEĞİŞKENLER
        // ============================================
        let allChannels = [];
        let currentHls = null;
        let autoRefreshInterval = null;
        let currentPlayingIndex = -1;

        // ============================================
        // M3U DOSYASINI PARSE ETME
        // ============================================
        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};

                    // Kanal adını çek (son virgülden sonrası)
                    const nameMatch = line.match(/,(.+)$/);
                    if (nameMatch) {
                        currentChannel.name = nameMatch[1].trim();
                    }

                    // group-title çek
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch) {
                        currentChannel.group = groupMatch[1];
                    }

                    // tvg-logo çek
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) {
                        currentChannel.logo = logoMatch[1];
                    }

                    // tvg-id çek
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    if (idMatch) {
                        currentChannel.id = idMatch[1];
                    }

                } else if (line && !line.startsWith('#') && currentChannel) {
                    // Bu satır URL
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }

            return channels;
        }

        // ============================================
        // M3U LİSTESİNİ YÜKLE
        // ============================================
        async function loadM3U(isRefresh = false) {
            const m3uUrl = document.getElementById('m3uUrl').value.trim();
            const filterText = document.getElementById('channelFilter').value.trim();

            if (!m3uUrl) {
                setStatus('❌ Lütfen bir M3U URL\'si girin!', 'error');
                return;
            }

            setStatus('📥 M3U listesi indiriliyor...', '');
            showLoading('M3U listesi yükleniyor...');

            try {
                // CORS proxy kullanmadan direkt çek (GitHub raw için çalışır)
                // Tarayıcı cache'ini kırmak için timestamp ekle
                const cacheBuster = '?t=' + Date.now();
                const response = await fetch(m3uUrl + cacheBuster);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const content = await response.text();

                // Parse et
                allChannels = parseM3U(content);

                if (allChannels.length === 0) {
                    setStatus('⚠️ M3U dosyasında kanal bulunamadı!', 'error');
                    hideLoading();
                    return;
                }

                setStatus(`✅ ${allChannels.length} kanal bulundu!`, 'success');
                document.getElementById('channelCount').textContent = allChannels.length + ' kanal';

                // Kanal listesini göster
                renderChannelList(allChannels);

                // Eğer filtre varsa, o kanalı otomatik bul ve oynat
                if (filterText) {
                    const foundIndex = allChannels.findIndex(ch =>
                        ch.name && ch.name.toLowerCase().includes(filterText.toLowerCase())
                    );

                    if (foundIndex !== -1) {
                        const found = allChannels[foundIndex];
                        setStatus(`🎯 "${found.name}" bulundu! Oynatılıyor...`, 'success');
                        playChannel(foundIndex);
                    } else {
                        setStatus(`⚠️ "${filterText}" ile eşleşen kanal bulunamadı.`, 'error');
                        hideLoading();
                    }
                } else {
                    hideLoading();
                    if (isRefresh && currentPlayingIndex >= 0) {
                        // Yenileme sırasında mevcut kanalı tekrar oynat (link güncellenmiş olabilir)
                        playChannel(currentPlayingIndex);
                    }
                }

            } catch (error) {
                console.error('M3U yükleme hatası:', error);

                // CORS hatası olabilir, proxy dene
                setStatus('⚠️ Direkt erişim başarısız, CORS proxy deneniyor...', '');
                try {
                    await loadWithProxy(m3uUrl, filterText, isRefresh);
                } catch (proxyError) {
                    setStatus('❌ Yükleme hatası: ' + error.message, 'error');
                    hideLoading();
                }
            }
        }

        // CORS Proxy ile yükleme
        async function loadWithProxy(m3uUrl, filterText, isRefresh) {
            const proxyUrls = [
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(m3uUrl),
                'https://corsproxy.io/?' + encodeURIComponent(m3uUrl)
            ];

            for (const proxyUrl of proxyUrls) {
                try {
                    const response = await fetch(proxyUrl);
                    if (response.ok) {
                        const content = await response.text();
                        allChannels = parseM3U(content);

                        if (allChannels.length > 0) {
                            setStatus(`✅ Proxy ile ${allChannels.length} kanal bulundu!`, 'success');
                            document.getElementById('channelCount').textContent = allChannels.length + ' kanal';
                            renderChannelList(allChannels);

                            if (filterText) {
                                const foundIndex = allChannels.findIndex(ch =>
                                    ch.name && ch.name.toLowerCase().includes(filterText.toLowerCase())
                                );
                                if (foundIndex !== -1) {
                                    playChannel(foundIndex);
                                    return;
                                }
                            }

                            if (isRefresh && currentPlayingIndex >= 0) {
                                playChannel(currentPlayingIndex);
                            }
                            hideLoading();
                            return;
                        }
                    }
                } catch (e) {
                    continue;
                }
            }
            throw new Error('Tüm proxy\'ler başarısız');
        }

        // ============================================
        // KANAL OYNATMA
        // ============================================
        function playChannel(index) {
            const channel = allChannels[index];
            if (!channel || !channel.url) {
                setStatus('❌ Kanal URL\'si bulunamadı!', 'error');
                return;
            }

            currentPlayingIndex = index;
            const video = document.getElementById('videoPlayer');
            const url = channel.url.trim();

            // Kanal bilgilerini güncelle
            document.getElementById('channelNameDisplay').textContent = channel.name || 'Bilinmeyen Kanal';
            document.getElementById('channelGroupDisplay').textContent = channel.group || '';
            document.getElementById('liveBadge').style.display = 'inline-block';

            if (channel.logo) {
                document.getElementById('channelLogo').src = channel.logo;
            }

            // Aktif kanalı işaretle
            document.querySelectorAll('.channel-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            showLoading(`"${channel.name}" yükleniyor...`);

            // Önceki HLS instance'ı temizle
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            // HLS stream mi kontrol et
            if (url.includes('.m3u8') || url.includes('m3u8')) {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90
                    });

                    currentHls = hls;

                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        hideLoading();
                        video.play().catch(e => {
                            setStatus('⚠️ Otomatik oynatma engellendi. Play butonuna basın.', '');
                        });
                        setStatus(`▶️ Oynatılıyor: ${channel.name}`, 'success');
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS Hatası:', data);
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    setStatus('❌ Ağ hatası. Yeniden deneniyor...', 'error');
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    setStatus('❌ Medya hatası. Kurtarılıyor...', 'error');
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    setStatus('❌ Oynatma hatası: ' + data.details, 'error');
                                    hideLoading();
                                    break;
                            }
                        }
                    });

                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS desteği
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        hideLoading();
                        video.play();
                    });
                } else {
                    setStatus('❌ Tarayıcınız HLS desteklemiyor!', 'error');
                    hideLoading();
                }
            } else {
                // Normal video URL (mp4, vs.)
                video.src = url;
                video.addEventListener('loadeddata', () => {
                    hideLoading();
                    setStatus(`▶️ Oynatılıyor: ${channel.name}`, 'success');
                }, { once: true });

                video.addEventListener('error', () => {
                    setStatus('❌ Video yüklenemedi: ' + url, 'error');
                    hideLoading();
                }, { once: true });

                video.play().catch(e => {
                    setStatus('⚠️ Otomatik oynatma engellendi. Play butonuna basın.', '');
                    hideLoading();
                });
            }
        }

        // ============================================
        // KANAL LİSTESİ RENDER
        // ============================================
        function renderChannelList(channels) {
            const container = document.getElementById('channelList');

            if (channels.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #555;">Kanal bulunamadı</div>';
                return;
            }

            let html = '';
            channels.forEach((ch, index) => {
                const isActive = index === currentPlayingIndex;
                const logo = ch.logo || 'https://via.placeholder.com/32x32/333/888?text=TV';
                const originalIndex = allChannels.indexOf(ch);

                html += `
                    <div class="channel-item ${isActive ? 'active' : ''}"
                         onclick="playChannel(${originalIndex})"
                         data-name="${(ch.name || '').toLowerCase()}"
                         data-group="${(ch.group || '').toLowerCase()}">
                        <img src="${logo}" alt="" onerror="this.src='https://via.placeholder.com/32x32/333/888?text=TV'">
                        <div class="ch-info">
                            <div class="ch-name">${ch.name || 'İsimsiz'}</div>
                            <div class="ch-group">${ch.group || ''}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================
        // KANAL ARAMA / FİLTRELEME
        // ============================================
        function filterChannelList() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (!searchTerm) {
                renderChannelList(allChannels);
                return;
            }

            const filtered = allChannels.filter(ch =>
                (ch.name && ch.name.toLowerCase().includes(searchTerm)) ||
                (ch.group && ch.group.toLowerCase().includes(searchTerm))
            );

            renderChannelList(filtered);
        }

        // ============================================
        // OTOMATİK YENİLEME (Link güncelleme takibi)
        // ============================================
        function startAutoRefresh() {
            stopAutoRefresh(); // Öncekini durdur

            const minutes = 5;
            setStatus(`⏱️ Otomatik yenileme aktif: Her ${minutes} dakikada bir güncelleniyor.`, 'success');

            autoRefreshInterval = setInterval(() => {
                setStatus('🔄 Otomatik yenileme yapılıyor...', '');
                loadM3U(true);
            }, minutes * 60 * 1000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                setStatus('⏹️ Otomatik yenileme durduruldu.', '');
            }
        }

        // ============================================
        // YARDIMCI FONKSİYONLAR
        // ============================================
        function setStatus(text, type) {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = 'status-text' + (type ? ' ' + type : '');
        }

        function showLoading(text) {
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            overlay.classList.remove('hidden');
            loadingText.textContent = text || 'Yükleniyor...';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // ============================================
        // SAYFA YÜKLENĞ OTOMATIK BAŞLAT
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            // Sayfa açıldığında otomatik yükle
            setTimeout(() => {
                loadM3U();
            }, 500);
        });
    </script>

</body>
</html>
